name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Properties and Dependencies
      run: |
        # 1. إنشاء Keystore وهمي
        keytool -genkey -v -keystore "$GITHUB_WORKSPACE/dummy.keystore" -alias dummy -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Dummy, OU=Dummy, O=Dummy, L=Dummy, S=Dummy, C=US"

        # 2. تحويل Keystore إلى Base64
        DUMMY_BASE64=$(base64 -w 0 "$GITHUB_WORKSPACE/dummy.keystore")

        # 3. إعداد keystore.properties
        cat <<EOF > keystore.properties
        keyAlias=dummy
        keyPassword=123456
        storeFile=dummy.keystore
        storePassword=123456
        EOF

        # 4. إعداد gradle.properties و local.properties
        echo "" >> gradle.properties
        echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/dummy.keystore" >> gradle.properties
        echo "KEYSTORE_PASSWORD=123456" >> gradle.properties
        echo "KEY_ALIAS=dummy" >> gradle.properties
        echo "KEYSTORE_ALIAS=dummy" >> gradle.properties
        echo "KEY_PASSWORD=123456" >> gradle.properties

        cp gradle.properties local.properties

        # 5. تشغيل سكريبت الإعداد
        if [ -f setUpPropertiesCI.sh ]; then
          chmod +x setUpPropertiesCI.sh
          export KEYSTORE_FILE="$DUMMY_BASE64"
          export KEYSTORE_PASSWORD="123456"
          export KEY_ALIAS="dummy"
          export KEYSTORE_ALIAS="dummy"
          export KEY_PASSWORD="123456"
          ./setUpPropertiesCI.sh || true
        fi

        # 6. ضبط ملف crashreporting.properties
        cat <<EOF > crashreporting.properties
        acraEnabled=false
        acraUrl=""\"\"""
        acraUser=""\"\"""
        acraPassword=""\"\"""
        EOF

    - name: Build Debug APK
      env:
        VERSION_CODE: "1"
        VERSION_NAME: "1.0.0"
        BRANCH_NAME: "main"
      run: |
        ./gradlew assembleUnstableDebug \
          -DVERSION_CODE=1 \
          -DVERSION_NAME=1.0.0 \
          -PKEYSTORE_FILE="$GITHUB_WORKSPACE/dummy.keystore" \
          -PKEYSTORE_PASSWORD="123456" \
          -PKEY_ALIAS="dummy" \
          -PKEY_PASSWORD="123456" \
          --stacktrace \
          --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZEBOARD-APK
        path: '**/build/outputs/apk/**/*.apk'
