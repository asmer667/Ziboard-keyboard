name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Build Properties Setup
      env:
        KEYSTORE_FILE: "dummy"
        KEYSTORE_PASSWORD: "dummy"
        KEY_ALIAS: "dummy"
        KEY_PASSWORD: "dummy"
      run: |
        if [ -f setUpPropertiesCI.sh ]; then
          chmod +x setUpPropertiesCI.sh
          ./setUpPropertiesCI.sh || true
        fi

    - name: Build Debug APK
      env:
        VERSION_CODE: 1
        VERSION_NAME: "1.0.0"
        BRANCH_NAME: "main"
      run: ./gradlew assembleDebug -DVERSION_CODE=1 -DVERSION_NAME=1.0.0 --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZEBOARD-APK
        path: '**/build/outputs/apk/debug/*.apk'
