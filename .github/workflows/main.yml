name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Generate Required Code Files
      run: |
        python3 generate_code.py || true

    - name: Build Debug APK
      env:
        VERSION_CODE: "1"
        VERSION_NAME: "1.0.0"
        BRANCH_NAME: "main"
      run: |
        ./gradlew assembleUnstableDebug \
          -DVERSION_CODE=1 \
          -DVERSION_NAME=1.0.0 \
          -PKEYSTORE_FILE="$GITHUB_WORKSPACE/dummy.keystore" \
          -PKEYSTORE_PASSWORD="123456" \
          -PKEY_ALIAS="dummy" \
          -PKEY_PASSWORD="123456" \
          --info \
          --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZEBOARD-APK
        path: app/build/outputs/apk/unstable/debug/*.apk
