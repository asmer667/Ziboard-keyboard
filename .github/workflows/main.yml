name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set up Properties
      run: |
        if [ -f setUpPropertiesCI.sh ]; then
          chmod +x setUpPropertiesCI.sh
          ./setUpPropertiesCI.sh
        fi

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug -DVERSION_CODE=1 -DVERSION_NAME=1.0.0 --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ZEBOARD-APK
        path: java/build/outputs/apk/debug/*.apk
