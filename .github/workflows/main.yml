name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate Dummy Keystore and Properties
      run: |
        # إنشاء ملف كي ستور وهمي حقيقي باستخدام keytool
        keytool -genkey -v -keystore dummy.keystore -alias dummy -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Dummy, OU=Dummy, O=Dummy, L=Dummy, S=Dummy, C=US"
        
        # إنشاء ملفات الخصائص المطلوبة لـ Gradle
        echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/dummy.keystore" > keystore.properties
        echo "KEYSTORE_PASSWORD=123456" >> keystore.properties
        echo "KEY_ALIAS=dummy" >> keystore.properties
        echo "KEY_PASSWORD=123456" >> keystore.properties
        
        # إنشاء ملف crashreporting لمنع تحذير الغياب
        echo "disabled=true" > crashreporting.properties

    - name: Run Build Properties Setup
      env:
        KEYSTORE_FILE: "${{ github.workspace }}/dummy.keystore"
        KEYSTORE_PASSWORD: "123456"
        KEY_ALIAS: "dummy"
        KEY_PASSWORD: "123456"
      run: |
        if [ -f setUpPropertiesCI.sh ]; then
          chmod +x setUpPropertiesCI.sh
          ./setUpPropertiesCI.sh || true
        fi

    - name: Build Debug APK
      env:
        VERSION_CODE: 1
        VERSION_NAME: "1.0.0"
        BRANCH_NAME: "main"
      run: ./gradlew assembleDebug -DVERSION_CODE=1 -DVERSION_NAME=1.0.0 --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZEBOARD-APK
        path: '**/build/outputs/apk/debug/*.apk'
