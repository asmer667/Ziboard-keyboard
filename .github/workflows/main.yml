name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Dummy Properties and Environment
      run: |
        # 1. إنشاء Keystore وهمي
        keytool -genkey -v -keystore "$GITHUB_WORKSPACE/dummy.keystore" -alias dummy -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Dummy, OU=Dummy, O=Dummy, L=Dummy, S=Dummy, C=US"

        # 2. تحويل Keystore إلى Base64
        DUMMY_BASE64=$(base64 -w 0 "$GITHUB_WORKSPACE/dummy.keystore")

        # 3. التأكد من نهاية السطر وإضافة القيم لـ gradle.properties
        echo "" >> gradle.properties
        echo 'KEYSTORE_FILE="'$GITHUB_WORKSPACE'/dummy.keystore"' >> gradle.properties
        echo 'KEYSTORE_PASSWORD="123456"' >> gradle.properties
        echo 'KEY_ALIAS="dummy"' >> gradle.properties
        echo 'KEYSTORE_ALIAS="dummy"' >> gradle.properties
        echo 'KEY_PASSWORD="123456"' >> gradle.properties
        echo 'CRASH_REPORTING_URL="https://localhost"' >> gradle.properties
        echo 'CRASH_REPORTING_KEY="dummy"' >> gradle.properties
        echo 'SENTRY_DSN="https://dummy@localhost/1"' >> gradle.properties
        echo 'API_KEY="dummy"' >> gradle.properties
        echo 'DEVELOPER_KEY="dummy"' >> gradle.properties
        echo 'BUILD_TYPE="debug"' >> gradle.properties

        cp gradle.properties local.properties
        echo "disabled=true" > crashreporting.properties

        # 4. تشغيل سكريبت الإعداد وتوليد الملفات المطلوبة
        if [ -f setUpPropertiesCI.sh ]; then
          chmod +x setUpPropertiesCI.sh
          export KEYSTORE_FILE="$DUMMY_BASE64"
          export KEYSTORE_PASSWORD="123456"
          export KEY_ALIAS="dummy"
          export KEYSTORE_ALIAS="dummy"
          export KEY_PASSWORD="123456"
          ./setUpPropertiesCI.sh || true
        fi

    - name: Build Debug APK
      env:
        VERSION_CODE: "1"
        VERSION_NAME: "1.0.0"
        BRANCH_NAME: "main"
        KEYSTORE_FILE: "${{ github.workspace }}/dummy.keystore"
        KEYSTORE_PASSWORD: "123456"
        KEY_ALIAS: "dummy"
        KEYSTORE_ALIAS: "dummy"
        KEY_PASSWORD: "123456"
        CRASH_REPORTING_URL: "https://localhost"
        CRASH_REPORTING_KEY: "dummy"
        SENTRY_DSN: "https://dummy@localhost/1"
        API_KEY: "dummy"
        DEVELOPER_KEY: "dummy"
      run: |
        ./gradlew assembleDebug \
          -DVERSION_CODE=1 \
          -DVERSION_NAME=1.0.0 \
          -PKEYSTORE_FILE="$GITHUB_WORKSPACE/dummy.keystore" \
          -PKEYSTORE_PASSWORD="123456" \
          -PKEY_ALIAS="dummy" \
          -PKEYSTORE_ALIAS="dummy" \
          -PKEY_PASSWORD="123456" \
          -PCRASH_REPORTING_URL="https://localhost" \
          -PCRASH_REPORTING_KEY="dummy" \
          -PSENTRY_DSN="https://dummy@localhost/1" \
          -PAPI_KEY="dummy" \
          -PDEVELOPER_KEY="dummy" \
          --stacktrace \
          --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZEBOARD-APK
        path: '**/build/outputs/apk/debug/*.apk'
