name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Properties and Generate Generated Code
      run: |
        # 1. إنشاء Keystore وهمي متوافق
        keytool -genkey -v -keystore "$GITHUB_WORKSPACE/dummy.keystore" -alias dummy -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Dummy, OU=Dummy, O=Dummy, L=Dummy, S=Dummy, C=US"

        # 2. كتابة إعدادات keystore المطلوبة
        echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/dummy.keystore" > keystore.properties
        echo "KEYSTORE_PASSWORD=123456" >> keystore.properties
        echo "KEY_ALIAS=dummy" >> keystore.properties
        echo "KEY_PASSWORD=123456" >> keystore.properties

        echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/dummy.keystore" >> local.properties
        echo "KEYSTORE_PASSWORD=123456" >> local.properties
        echo "KEY_ALIAS=dummy" >> local.properties
        echo "KEY_PASSWORD=123456" >> local.properties

        echo "disabled=true" > crashreporting.properties

        # 3. تشغيل سكريبت التوليد لتفادي أخطاء Unresolved reference 'LatinIME'
        if [ -f setUpPropertiesCI.sh ]; then
          chmod +x setUpPropertiesCI.sh
          export KEYSTORE_FILE="$GITHUB_WORKSPACE/dummy.keystore"
          export KEYSTORE_PASSWORD="123456"
          export KEY_ALIAS="dummy"
          export KEY_PASSWORD="123456"
          ./setUpPropertiesCI.sh
        fi

    - name: Build Debug APK
      env:
        VERSION_CODE: 1
        VERSION_NAME: "1.0.0"
        BRANCH_NAME: "main"
        KEYSTORE_FILE: "${{ github.workspace }}/dummy.keystore"
        KEYSTORE_PASSWORD: "123456"
        KEY_ALIAS: "dummy"
        KEY_PASSWORD: "123456"
      run: |
        ./gradlew assembleDebug \
          -DVERSION_CODE=1 \
          -DVERSION_NAME=1.0.0 \
          -PKEYSTORE_FILE="$GITHUB_WORKSPACE/dummy.keystore" \
          -PKEYSTORE_PASSWORD="123456" \
          -PKEY_ALIAS="dummy" \
          -PKEY_PASSWORD="123456" \
          --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZEBOARD-APK
        path: '**/build/outputs/apk/debug/*.apk'
